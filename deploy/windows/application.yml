ruoyi:
  name: CyanExam
  version: 3.9.2
  copyrightYear: 2026
  profile: ${RUOYI_PROFILE}
  addressEnabled: false
  captchaType: math
server:
  address: 127.0.0.1
  port: ${SERVER_PORT:9010}
  servlet:
    context-path: /
spring:
  profiles:
    active: druid
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      database: ${SPRING_DATA_REDIS_DATABASE}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 10s
user:
  password:
    maxRetryCount: 5
    lockTime: 10
token:
  header: Authorization
  secret: ${TOKEN_SECRET}
  expireTime: 30
mybatis:
  typeAliasesPackage: com.cyan.exam.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql
logging:
  level:
    com.cyan.exam: info
    org.springframework: warn
springdoc:
  swagger-ui:
    enabled: false
referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1
xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*
